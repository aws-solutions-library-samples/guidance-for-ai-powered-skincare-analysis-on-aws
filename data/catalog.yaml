# Catalog Configuration
# This is the ONLY file you need to edit to integrate your own product data.
#
# 1. List your product categories under `categories`
# 2. Map your CSV column names under `schema`
# 3. Place your CSV file at data/products.csv
# 4. Run `terraform apply` — data loads automatically

# Product categories available in your catalog.
# The AI agent uses these names to build skincare routines.
# You can add, remove, or rename categories to match your product line.
categories:
  - Cleanser
  - Toner
  - Serum
  - Moisturiser
  - Exfoliator
  - Sunscreen

# Column mapping: YOUR CSV column names → system fields.
# Only category_field, name_field, and ingredients_field are required.
schema:
  category_field: "product_type"
  name_field: "product_name"
  ingredients_field: "ingredients"
  price_field: "price"
  image_field: "image_url"

# Display preferences
currency: "£"
