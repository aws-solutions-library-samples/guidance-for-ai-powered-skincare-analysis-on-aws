[project]
name = "smart-beauty"
version = "1.0.0"
description = "Photo-based skincare recommendations with a streaming agent workflow."
requires-python = ">=3.11"
dependencies = [
    "bedrock-agentcore==1.4.0",
    "boto3==1.43.14",
    "numpy==2.3.3",
    "pillow==13.0.0",
    "pydantic==2.12.5",
    "pyyaml==6.0.3",
    "strands-agents==1.28.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "requests==2.32.5",
]
runtime = [
    "aws-opentelemetry-distro==0.10.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-ra"
