# Proposed acceptance configuration, not an executable benchmark or measured result.
# Freeze at G0. No unspecified cost ceiling may be interpreted as "unlimited".
spec_version: "1.0"
status: proposed
as_of: "2026-10-23"

workload:
  active_products: 1000000
  checkpoint_products: [1000, 10000, 100000, 1000000]
  extension_products: 10000000
  routines_per_second: 20
  typical_steps: 6
  maximum_steps: 8
  typical_step_searches_per_second: 120
  maximum_step_searches_per_second: 160
  burst_routines_per_second: 40
  burst_duration_minutes: 5
  update_events_per_second: 100
  update_burst_events_per_second: 1000
  update_burst_duration_minutes: 5
  query_mix:
    broad_eligibility: 0.25
    category_only: 0.25
    eligibility_one_percent: 0.20
    eligibility_point_one_percent: 0.15
    fewer_than_k_eligible: 0.10
    known_no_match: 0.05
  result_cache_hit_rate_for_gating: 0

search_bounds:
  required_ingredient_references_max: 20
  excluded_ingredient_references_max: 20
  preferred_ingredients_max: 20
  rendered_query_characters_max: 2048
  lexical_candidates: 100
  ann_candidates: 100
  union_candidates_max: 200
  hydrate_distinct_products_max: 100
  rerank_candidates: 50
  final_products_max: 3
  refill_attempts_max: 1
  dependency_retries_max: 1
  finalization_retries_per_routine_max: 1
  routine_retrieval_wave_p99_ms: 1500
  step_deadline_ms: 1200
  routine_retrieval_wave_deadline_ms: 1600

performance:
  step_search_p95_ms: 500
  step_search_p99_ms: 1000
  routine_first_product_p95_seconds: 30
  routine_complete_p95_seconds: 60
  routine_complete_p99_seconds: 90
  sse_silence_max_seconds: 15
  service_error_rate_max: 0.001
  routine_service_failure_rate_max: 0.01
  valid_completion_rate_min: 0.99
  warmup_minutes_min: 15
  measured_minutes_per_cell_min: 30
  independent_repetitions: 3
  soak_hours: 4
  burst_recovery_minutes_max: 5
  fallback_fraction_max_steady_state: 0.01

freshness:
  lexical_update_p95_seconds: 30
  embedding_update_p95_seconds: 300
  source_change_age_alarm_seconds: 60
  ingestion_hard_stale_seconds: 300
  changed_content_embedding_coverage_min: 0.99
  tombstone_retention_days_min: 7
  rollback_index_retention_days_min: 7
  source_replay_retention_days_min: 7
  catalog_reconciliation_hours: 24
  full_rebuild_hours_max: 12
  config_or_index_rollback_minutes_max: 5

quality:
  independent_profiles_dev_initial: 200
  independent_profiles_test_initial: 200
  binary_relevance_min_grade: 2
  ndcg_at_3_macro_min: 0.75
  ndcg_at_3_critical_slice_min: 0.65
  answerable_steps_with_good_top_3_result_min: 0.95
  reviewed_routine_acceptance_min: 0.90
  candidate_fraction_of_attainable_recall_at_100_macro_min: 0.95
  candidate_fraction_of_attainable_recall_at_100_critical_slice_min: 0.90
  ann_exact_neighbor_recall_at_100_macro_min: 0.95
  ndcg_at_3_gain: linear
  ranking_noninferiority_margin_absolute: 0.02
  optional_stage_min_point_lift_ndcg_absolute: 0.02
  paired_confidence_level: 0.95
  optional_stage_ci_lower_bound_must_exceed: 0
  bootstrap_resamples: 10000
  bootstrap_unit: profile
  bootstrap_seed: 17
  new_filter_or_catalog_fact_violations_allowed: 0
  observed_constraint_violation_rate_required: 0
  observed_critical_routine_rule_violations_required: 0
  known_no_match_abstention_min: 0.99
  answerable_false_abstention_max: 0.02
  pooled_top_10_judgment_coverage_min: 0.99
  minimum_critical_slice_independent_profiles: 30
  explanation_claim_support_rate_min: 0.99
  blind_double_review_fraction_min: 0.25
  test_repeated_model_seeds: 3

operations:
  shard_partial_results_allowed: false
  runtime_category_enumerations_allowed: 0
  source_of_truth_reads_bounded: true
  runtime_index_writes_allowed: false
  anonymous_search_access_allowed: false
  cross_customer_access_allowed: false
  deployment_strategy: staged_canary
  canary_percentages: [1, 5, 25, 100]
  canary_stage_hours_min: 24
  minimum_completed_routines_per_canary_stage: 1000
  shadow_fraction_initial: 0.01
  shadow_fraction_max: 0.05
  operational_alert_window_minutes: 5
  operational_alert_consecutive_windows: 2

cost:
  currency: USD
  maximum_usd_per_1000_completed_routines: null
  maximum_monthly_fixed_usd: null
  release_requires_customer_cost_ceiling: true
  include_failed_requests_and_retries: true
  include_upstream_agents_and_explanations: true
  report_indexing_and_rebuild_cost_separately: true
